name: Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# One push at a time; let a running push finish instead of cancelling it.
concurrency:
  group: itch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Relative-path build in itch/build (npm run itch), without the service worker.
      - run: npm run itch
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      # The html5 channel is the browser-played upload on https://samadipoor.itch.io/snack-hole.
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push itch/build samadipoor/snack-hole:html5 --userversion "$(git rev-parse --short HEAD)"
